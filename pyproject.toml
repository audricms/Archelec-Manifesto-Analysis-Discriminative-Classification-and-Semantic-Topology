[project]
name = "nlp-project"
version = "0.1.0"
description = "This project was developed as part of the \"Machine Learning for NLP\" course at ENSAE (2026), instructed by Christopher Kermorvant. This repository contains a reproducible Natural Language Processing (NLP) pipeline designed to extract, clean, and classify historical electoral manifestos from the French legislative and presidential elections (1981, 1988, 1993)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "arkindex-export==0.2.1",
    "datasets>=4.8.4",
    "gdown>=5.2.1",
    "ipywidgets>=8.1.8",
    "kaleido>=1.2.0",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pip>=26.0.1",
    "plotly>=6.6.0",
    "ruff>=0.15.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "spacy>=3.8.11",
    "torch>=2.10.0",
    "tqdm==4.67.3",
    "transformers>=5.4.0",
    "ty>=0.0.17",
    "umap-learn>=0.5.11",
]
